name: LCM - Gestão de Reservas
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['LCM - Funil de Vendas - CV CRM']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/reservas-dashboard.yml
      - scripts/refresh_reservas.py
      - tests/test_refresh_reservas.py
permissions:
  contents: write
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: lcm-all-leads-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências e testar
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_refresh_reservas.py' -v
      - name: Coletar vendas e validar sem divulgar dados pessoais
        env:
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
        run: python -u scripts/refresh_reservas.py
      - name: Publicar somente se a base não mudou desde a coleta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(reservas): publicar vendas conciliadas'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
