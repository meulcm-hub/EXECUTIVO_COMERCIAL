name: CV CRM - Verificar campos das conversoes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-conversion-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar somente nomes de campos e consistencia de datas
        env:
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
        run: python scripts/cv_conversion_schema_diagnostic.py
