name: LCM - Validar Gestao de Leads
on:
  push:
    branches: [main]
    paths:
      - leads.html
      - lcm-leads.js
      - lcm-leads-stage-config.js
      - tests/test_leads_stage_classification.cjs
      - lcm-leads.css
      - lcm-shell.js
      - tests/test_leads_dashboard_contract.py
      - .github/workflows/leads-dashboard-check.yml
  pull_request:
    paths:
      - leads.html
      - lcm-leads.js
      - lcm-leads.css
      - lcm-shell.js
      - tests/test_leads_dashboard_contract.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar JavaScript
        run: |
          node --check lcm-leads.js
          node --check lcm-leads-stage-config.js
          node --test tests/test_leads_stage_classification.cjs
          node --check lcm-shell.js
      - name: Verificar contrato CV CRM e isolamento
        run: python -m unittest discover -s tests -p 'test_leads_dashboard_contract.py' -v
