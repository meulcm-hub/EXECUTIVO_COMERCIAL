name: LCM - Validar Gestao de Leads
on:
  push:
    branches: [main]
    paths:
      - leads.html
      - lcm-leads.js
      - lcm-leads-model.js
      - lcm-leads-funnels.js
      - tests/test_leads_funnels.cjs
      - tests/leads_funnels_browser.cjs
      - leads_operations.py
      - server.py
      - tests/test_leads_management.cjs
      - tests/test_leads_operations.py
      - tests/test_leads_private_routes.py
      - lcm-leads-stage-config.js
      - tests/test_leads_stage_classification.cjs
      - tests/test_leads_render_fallback.cjs
      - tests/test_leads_integral_v1.cjs
      - lcm-leads.css
      - lcm-shell.js
      - tests/test_leads_dashboard_contract.py
      - .github/workflows/leads-dashboard-check.yml
  pull_request:
    paths:
      - leads.html
      - lcm-leads.js
      - lcm-leads.css
      - lcm-shell.js
      - tests/test_leads_dashboard_contract.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar JavaScript
        run: |
          node --check lcm-leads-model.js
          node --test tests/test_leads_management.cjs
          node --test tests/test_leads_funnels.cjs
          node --check lcm-leads-funnels.js
          node --check lcm-leads.js
          node --check lcm-leads-stage-config.js
          node --test tests/test_leads_stage_classification.cjs
          node --test tests/test_leads_render_fallback.cjs
          node --test tests/test_leads_integral_v1.cjs
          node --check lcm-shell.js
      - name: Verificar contrato CV CRM e isolamento
        run: |
          python -m unittest discover -s tests -p 'test_leads_dashboard_contract.py' -v
          python -m unittest discover -s tests -p 'test_leads_operations.py' -v
      - name: Verificar autenticação da carteira privada
        run: |
          python -m pip install -r requirements.txt httpx
          python -m unittest discover -s tests -p 'test_leads_private_routes.py' -v
      - name: Verificar os dois funis no desktop e celular
        run: |
          npm install --prefix "$RUNNER_TEMP/lcm-browser" playwright
          "$RUNNER_TEMP/lcm-browser/node_modules/.bin/playwright" install --with-deps chromium
          python -m http.server 8772 --bind 127.0.0.1 > "$RUNNER_TEMP/lcm-http.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/lcm-browser/node_modules" node tests/leads_funnels_browser.cjs
