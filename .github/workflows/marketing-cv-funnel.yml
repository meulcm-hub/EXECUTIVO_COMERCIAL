name: LCM - Funil comercial CV CRM por safra
on:
  schedule:
    - cron: '20 13 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/marketing_cv_funnel.py'
      - 'tests/test_marketing_cv_funnel.py'
      - '.github/workflows/marketing-cv-funnel.yml'
  workflow_dispatch:
concurrency:
  group: marketing-cv-funnel-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  funnel-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar regras e paginação sem credenciais
        run: python -m unittest discover -s tests -p 'test_marketing_cv_funnel.py'
      - name: Consolidar funil CV a partir de IDs somente em memória privada
        env:
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
        run: python scripts/marketing_cv_funnel.py
      - name: Publicar apenas contagens agregadas validadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cv-funnel.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza funil CV CRM agregado por safra"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Funil CV publicado"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi