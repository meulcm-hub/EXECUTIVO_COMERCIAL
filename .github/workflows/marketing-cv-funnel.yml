name: LCM - Funil comercial CV CRM por safra
on:
  schedule:
    - cron: '20 13 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/marketing_cv_funnel.py'
      - 'scripts/publish_cv_audit.py'
      - 'tests/test_publish_cv_audit.py'
      - 'tests/test_marketing_cv_funnel.py'
      - '.github/workflows/marketing-cv-funnel.yml'
  workflow_dispatch:
concurrency:
  group: marketing-cv-funnel-publication
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  funnel-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar regras e paginação sem credenciais
        run: |
          python -m unittest discover -s tests -p 'test_marketing_cv_funnel.py'
          python -m unittest discover -s tests -p 'test_cv_audit_cohort.py'
          python -m unittest discover -s tests -p 'test_publish_cv_audit.py'
          node --test tests/test_annual_cv_query.cjs tests/test_lcm_date_range.cjs
      - name: Consolidar funil CV a partir de IDs somente em memória privada
        env:
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CV_AUDIT_PRIVATE_PATH: ${{ runner.temp }}/cv-funnel-private.json
        run: python scripts/marketing_cv_funnel.py
      - name: Validar JSON agregado antes de publicar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          file = Path("data/cv-funnel.json")
          if not file.exists() or file.stat().st_size == 0:
              raise SystemExit("Funil sem dados: publicação interrompida")
          data = json.loads(file.read_text(encoding="utf-8"))
          if not (data.get("schema_version") == 2 and data.get("validated") is True
                  and isinstance(data.get("prospects"), list)):
              raise SystemExit("Funil inválido: publicação interrompida")
          print("Funil CV validado: " + str(len(data["prospects"])) + " grupos anônimos.")
          PY
      - name: Exportar somente as colunas públicas autorizadas da auditoria
        run: |
          python scripts/publish_cv_audit.py "${{ runner.temp }}/cv-funnel-private.json" data/cv-audit.json
          rm -f "${{ runner.temp }}/cv-funnel-private.json"
      - name: Publicar contagens agregadas e auditoria pública autorizada
        run: |
          publication_dir="${{ runner.temp }}/cv-publication"
          mkdir -p "$publication_dir"
          cp data/cv-funnel.json data/cv-audit.json "$publication_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            # Checkout descartável do runner: refazer apenas a publicação sobre
            # a main mais recente evita conflitos entre JSONs gerados em paralelo.
            git reset --hard origin/main
            cp "$publication_dir/cv-funnel.json" data/cv-funnel.json
            cp "$publication_dir/cv-audit.json" data/cv-audit.json
            git add data/cv-funnel.json data/cv-audit.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Atualiza funil e auditoria pública CV CRM"
            if git push origin HEAD:main; then
              echo "Funil CV publicado"
              exit 0
            fi
            sleep 5
          done
          exit 1
