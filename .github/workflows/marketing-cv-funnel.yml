name: LCM - Funil comercial CV CRM por safra
on:
  schedule:
    - cron: '20 13 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/marketing_cv_funnel.py'
      - 'marketing.html'
      - 'server.py'
      - 'tests/test_marketing_cv_funnel.py'
      - '.github/workflows/marketing-cv-funnel.yml'
  workflow_dispatch:
concurrency:
  group: marketing-cv-funnel-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  funnel-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar regras e paginação sem credenciais
        run: python -m unittest discover -s tests -p 'test_marketing_cv_funnel.py'
      - name: Consolidar funil CV a partir de IDs somente em memória privada
        env:
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          CV_AUDIT_PRIVATE_PATH: ${{ runner.temp }}/cv-funnel-private.json
        run: python scripts/marketing_cv_funnel.py
      - name: Validar JSON agregado antes de publicar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          file = Path("data/cv-funnel.json")
          if not file.exists() or file.stat().st_size == 0:
              raise SystemExit("Funil sem dados: publicação interrompida")
          data = json.loads(file.read_text(encoding="utf-8"))
          if not (data.get("schema_version") == 1 and data.get("validated") is True
                  and isinstance(data.get("cohorts"), list) and data["cohorts"]):
              raise SystemExit("Funil inválido: publicação interrompida")
          print("Funil CV validado: " + str(len(data["cohorts"])) + " recortes.")
          PY
      - name: Criptografar auditoria individual sem publicar dados brutos
        id: encrypt_audit
        env:
          CV_AUDIT_PASSWORD: ${{ secrets.CV_AUDIT_PASSWORD }}
        run: |
          if [ -z "$CV_AUDIT_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Auditoria individual sem exportação: configure o secret CV_AUDIT_PASSWORD."
            exit 0
          fi
          python -m pip install cryptography
          python scripts/encrypt_cv_audit.py ${{ runner.temp }}/cv-funnel-private.json cv-audit-private.enc.json
          rm -f ${{ runner.temp }}/cv-funnel-private.json
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Disponibilizar auditoria criptografada
        if: steps.encrypt_audit.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-cv-criptografada
          path: cv-audit-private.enc.json
          retention-days: 3
          if-no-files-found: error
      - name: Publicar apenas contagens agregadas validadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cv-funnel.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza funil CV CRM agregado por safra"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Funil CV publicado"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi