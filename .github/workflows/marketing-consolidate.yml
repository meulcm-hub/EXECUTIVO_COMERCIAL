name: LCM - Consolidacao segura Meta e CV
on:
  # Início das coletas: 06h, 12h e 18h no horário de Brasília (UTC-3).
  schedule:
    - cron: '0 9,15,21 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/marketing_daily.py'
      - 'scripts/meta_ads_collector.py'
      - 'scripts/marketing_campaigns.py'
      - 'scripts/marketing_consolidate.py'
      - '.github/workflows/marketing-consolidate.yml'
  workflow_dispatch:
    inputs:
      cv_pages:
        description: 'Paginas de leads CV para amostragem (1 a 50)'
        required: true
        default: '50'
concurrency:
  group: marketing-aggregated-publication
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar classificacao CV Facebook e WhatsApp
        run: |
          python -m unittest discover -s tests -p 'test_marketing_channels.py'
          python -m unittest discover -s tests -p 'test_meta_error_codes.py'
      - name: Consolidar janelas de 7 e 30 dias
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ vars.META_AD_ACCOUNT_IDS }}
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          MARKETING_INGEST_URL: ${{ secrets.MARKETING_INGEST_URL }}
          MARKETING_INGEST_TOKEN: ${{ secrets.MARKETING_INGEST_TOKEN }}
        run: |
          python scripts/marketing_consolidate.py --days 7 --cv-pages "${{ inputs.cv_pages || '50' }}" --public-output data/marketing-7.json
          python scripts/marketing_consolidate.py --days 30 --cv-pages "${{ inputs.cv_pages || '50' }}" --public-output data/marketing-30.json
          cp data/marketing-30.json data/marketing-aggregated.json
      - name: Criar histórico diário agregado para calendário
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ vars.META_AD_ACCOUNT_IDS }}
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
        run: python scripts/marketing_daily.py
      - name: Consultar leads e gasto por campanha Meta sem PII
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ vars.META_AD_ACCOUNT_IDS }}
        run: python scripts/marketing_campaigns.py
      - name: Publicar somente JSON agregado validado
        run: |
          publication_dir="${{ runner.temp }}/annual-publication"
          mkdir -p "$publication_dir"
          cp data/marketing-aggregated.json data/marketing-7.json data/marketing-30.json data/marketing-daily.json data/marketing-campaigns.json "$publication_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$publication_dir/marketing-aggregated.json" data/marketing-aggregated.json
            cp "$publication_dir/marketing-7.json" data/marketing-7.json
            cp "$publication_dir/marketing-30.json" data/marketing-30.json
            cp "$publication_dir/marketing-daily.json" data/marketing-daily.json
            cp "$publication_dir/marketing-campaigns.json" data/marketing-campaigns.json
            git add data/marketing-aggregated.json data/marketing-7.json data/marketing-30.json data/marketing-daily.json data/marketing-campaigns.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Atualiza histórico acumulado desde janeiro de 2026"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1

