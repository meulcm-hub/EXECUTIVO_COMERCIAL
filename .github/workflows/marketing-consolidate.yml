name: LCM - Consolidacao segura Meta e CV
on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Periodo em dias fechados (1 a 90)'
        required: true
        default: '30'
      cv_pages:
        description: 'Paginas de leads CV para amostragem (1 a 50)'
        required: true
        default: '10'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidar em memoria sem exportar informacoes
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ vars.META_AD_ACCOUNT_IDS }}
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          MARKETING_INGEST_URL: ${{ secrets.MARKETING_INGEST_URL }}
          MARKETING_INGEST_TOKEN: ${{ secrets.MARKETING_INGEST_TOKEN }}
        run: python scripts/marketing_consolidate.py --days "${{ inputs.days || '30' }}" --cv-pages "${{ inputs.cv_pages || '10' }}" --public-output data/marketing-aggregated.json
      - name: Publicar somente JSON agregado validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marketing-aggregated.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza indicadores agregados de Marketing"
            git push origin HEAD:main
          else
            echo "Nenhuma alteração em indicadores"
          fi
