name: LCM - Consolidacao segura Meta e CV
on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Periodo em dias fechados (1 a 90)'
        required: true
        default: '30'
      cv_pages:
        description: 'Paginas de leads CV para amostragem (1 a 50)'
        required: true
        default: '50'
concurrency:
  group: marketing-aggregated-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidar janelas de 7 e 30 dias
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ vars.META_AD_ACCOUNT_IDS }}
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
          MARKETING_INGEST_URL: ${{ secrets.MARKETING_INGEST_URL }}
          MARKETING_INGEST_TOKEN: ${{ secrets.MARKETING_INGEST_TOKEN }}
        run: |
          python scripts/marketing_consolidate.py --days 7 --cv-pages "${{ inputs.cv_pages || '50' }}" --public-output data/marketing-7.json
          python scripts/marketing_consolidate.py --days 30 --cv-pages "${{ inputs.cv_pages || '50' }}" --public-output data/marketing-30.json
          cp data/marketing-30.json data/marketing-aggregated.json
      - name: Criar histórico diário agregado para calendário
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ vars.META_AD_ACCOUNT_IDS }}
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
        run: python scripts/marketing_daily.py
      - name: Consultar leads e gasto por campanha Meta sem PII
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ vars.META_AD_ACCOUNT_IDS }}
        run: python scripts/marketing_campaigns.py
      - name: Publicar somente JSON agregado validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marketing-aggregated.json data/marketing-7.json data/marketing-30.json data/marketing-daily.json data/marketing-campaigns.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza indicadores agregados de Marketing"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Indicadores publicados com sucesso"
                exit 0
              fi
              echo "Tentativa de publicação não concluída: $attempt"
              git rebase --abort 2>/dev/null || true
              sleep 4
            done
            echo "Falha ao publicar após três tentativas"
            exit 1
          else
            echo "Nenhuma alteração em indicadores"
          fi
