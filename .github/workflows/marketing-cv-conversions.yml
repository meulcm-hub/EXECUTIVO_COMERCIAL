name: LCM - Conversoes CV por empreendimento e dia
on:
  # Executa após a atualização diária de Marketing (11:15 UTC).
  schedule:
    - cron: '45 11 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/marketing_conversions_daily.py'
      - '.github/workflows/marketing-cv-conversions.yml'
  workflow_dispatch:
concurrency:
  group: marketing-cv-conversions-publication
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  conversion-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidar historico de leads e conversoes somente em memoria
        env:
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
        run: python scripts/marketing_conversions_daily.py
      - name: Publicar somente contagens agregadas revisadas
        run: |
          publication_dir="${{ runner.temp }}/annual-publication"
          mkdir -p "$publication_dir"
          cp data/marketing-conversions.json "$publication_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$publication_dir/marketing-conversions.json" data/marketing-conversions.json
            git add data/marketing-conversions.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Atualiza histórico acumulado desde janeiro de 2026"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
