name: LCM - Conversoes CV por empreendimento e dia
on:
  # Agendamento suspenso até que os eventos sem empreendimento
  # tenham fonte/critério de associação validado.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/marketing_conversions_daily.py', '.github/workflows/marketing-cv-conversions.yml']
concurrency:
  group: marketing-cv-conversions-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  conversion-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidar historico de leads e conversoes somente em memoria
        env:
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
        run: python scripts/marketing_conversions_daily.py
      - name: Publicar somente contagens agregadas revisadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marketing-conversions.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza conversoes CV agregadas por empreendimento"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Contagens CV publicadas"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi
