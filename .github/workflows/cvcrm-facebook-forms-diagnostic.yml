name: LCM - Diagnostico formulario Facebook no CV
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar sumarizacao sem dados reais
        run: python -m unittest discover -s tests -p test_cvcrm_facebook_forms_diagnostic.py -v
      - name: Consultar apenas metadados agregados da API v1
        env:
          CVCRM_DOMINIO: ${{ secrets.CVCRM_DOMINIO }}
          CVCRM_EMAIL: ${{ secrets.CVCRM_EMAIL }}
          CVCRM_TOKEN: ${{ secrets.CVCRM_TOKEN }}
        run: python scripts/cvcrm_facebook_forms_diagnostic.py
