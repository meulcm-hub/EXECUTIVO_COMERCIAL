name: Meta Ads - Diagnostico seguro de permissoes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/meta_permissions_diagnostic.py'
      - '.github/workflows/meta-permissions-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar a projecao segura do diagnostico
        run: python -m unittest discover -s tests -p 'test_meta_permissions_diagnostic.py'
      - name: Consultar somente permissoes e metadados de acesso
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python scripts/meta_permissions_diagnostic.py
